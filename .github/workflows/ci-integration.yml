name: CI — Integration

# Informational until branch protection promotes these checks to required.
# Scheduled full-suite runs use ci-nightly.yml; use workflow_dispatch for ad-hoc integration only.
on:
  workflow_dispatch:
  # TEMPORARY RC-tip hack: agent tokens cannot workflow_dispatch (403).
  # Push on this branch runs CI — Integration. Strip this trigger before any PR.
  push:
    branches:
      - cursor/epbs-lighthouse-v830-rc0-e660

permissions:
  contents: read
  # integration-test.yml uses gh cache delete/save (actions/cache/save); caller must grant write permission
  actions: write

concurrency:
  group: ci-integration
  cancel-in-progress: false

jobs:
  integration:
    uses: ./.github/workflows/integration-test.yml
    secrets: inherit
    with:
      artifact_name_prefix: integration-report
